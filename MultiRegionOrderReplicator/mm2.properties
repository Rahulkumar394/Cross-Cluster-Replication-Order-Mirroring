# ==================================
# MirrorMaker 2 Properties - THE FINAL CORRECT VERSION
# ==================================

clusters = local, remote

local.bootstrap.servers = kafka-local:29092
remote.bootstrap.servers = kafka-remote:29093

# Replication policy
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# Replication flow
local->remote.enabled = true
local->remote.topics = orders
local->remote.consumer.auto.offset.reset = earliest

# Internal topics config
offset.storage.replication.factor=1
config.storage.replication.factor=1
status.storage.replication.factor=1
replication.factor=1
offset-syncs.topic.replication.factor=1
heartbeats.topic.replication.factor=1
checkpoints.topic.replication.factor=1

# Group ID
group.id=mm2-cluster

# Disable security features
sync.topic.acls.enabled=false