## --- YEH DO LINES ADD KAREIN ---
## Agar topic nahi milta hai to dobara try karne se pehle wait time (milliseconds)
#spring.kafka.consumer.properties.reconnect.backoff.ms=1000
## Spring Kafka ko batao ki agar topic nahi milta to fataal error na de
#spring.kafka.listener.missing-topics-fatal=false

server.port=8081
app.topic.name=orders

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9093
spring.kafka.consumer.group-id=remote-order-validator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# ===============================================================
# THE MOST IMPORTANT FIX FOR JSON DESERIALIZATION
# ===============================================================
# Tell the deserializer to trust all packages, so it can find our 'Order' class.
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Tell the deserializer that if no label (header) is present,
# assume the message is for the 'Order' class.
# YEH PROPERTY AB SAHI KAAM KAREGI KYUNKI PRODUCER LABEL NAHI BHEJ RAHA
spring.kafka.consumer.properties.spring.json.default.type=com.example.consumerservice.model.Order